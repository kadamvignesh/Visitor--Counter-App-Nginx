<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1a16;
    --panel: #262119;
    --well: #100e0a;
    --brass: #c9a227;
    --brass-bright: #e4c34c;
    --ivory: #ede6d6;
    --muted: #9c927c;
    --ok: #7c9473;
    --err: #b5533c;
    --digit-h: 84px;
    --digit-w: 56px;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(circle at 50% 0%, #2a251c 0%, var(--bg) 55%);
    color: var(--ivory);
    font-family: 'Work Sans', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid #38321f;
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow:
      0 40px 80px -40px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 34px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s ease;
  }

  .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(124, 148, 115, 0.6); }
  .status-dot.err { background: var(--err); box-shadow: 0 0 8px rgba(181, 83, 60, 0.6); }

  /* --- Odometer --- */

  .odometer-frame {
    background: var(--well);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
    box-shadow:
      inset 0 4px 10px rgba(0, 0, 0, 0.65),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
  }

  .digit {
    width: var(--digit-w);
    height: var(--digit-h);
    overflow: hidden;
    border-radius: 6px;
    background: linear-gradient(180deg, #0a0906 0%, #151209 50%, #0a0906 100%);
    position: relative;
  }

  .digit::before,
  .digit::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 18px;
    z-index: 2;
    pointer-events: none;
  }

  .digit::before {
    top: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }

  .digit::after {
    bottom: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }

  .digit-strip {
    display: flex;
    flex-direction: column;
    transform: translateY(calc(var(--n, 0) * -1 * var(--digit-h)));
    transition: transform 0.5s cubic-bezier(0.22, 0.9, 0.24, 1);
  }

  .digit-strip span {
    height: var(--digit-h);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Spline Sans Mono', monospace;
    font-weight: 700;
    font-size: 44px;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
  }

  .caption {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 16px;
    letter-spacing: 0.02em;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 30px;
  }

  button {
    font-family: 'Work Sans', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    border-radius: 10px;
    padding: 13px 18px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:active { transform: translateY(1px); }

  button:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .btn-primary {
    flex: 1;
    background: var(--brass);
    color: #1c1a16;
  }

  .btn-primary:hover { background: var(--brass-bright); }

  .btn-secondary {
    background: transparent;
    border-color: #443c28;
    color: var(--muted);
  }

  .btn-secondary:hover {
    border-color: var(--brass);
    color: var(--ivory);
  }

  .error-msg {
    margin-top: 16px;
    font-size: 13px;
    color: var(--err);
    text-align: center;
    min-height: 16px;
  }

  @media (max-width: 400px) {
    :root { --digit-h: 64px; --digit-w: 42px; }
    .digit-strip span { font-size: 32px; }
    .card { padding: 30px 22px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .digit-strip { transition: none; }
    button { transition: none; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="top-row">
    <span class="eyebrow">Visitor Tally</span>
    <span class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">checking</span>
    </span>
  </div>

  <div class="odometer-frame" id="odometer" aria-live="polite" aria-label="Visit count"></div>

  <p class="caption">total visits logged since reset</p>

  <div class="actions">
    <button class="btn-primary" id="hitBtn">Log a visit</button>
    <button class="btn-secondary" id="resetBtn">Reset</button>
  </div>

  <p class="error-msg" id="errorMsg"></p>
</main>

<script>
  const DIGITS = 5;
  const odometer = document.getElementById('odometer');
  const hitBtn = document.getElementById('hitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const errorMsg = document.getElementById('errorMsg');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  // Build DIGITS wheels, each containing 0-9 stacked vertically.
  const wheels = [];
  for (let i = 0; i < DIGITS; i++) {
    const digit = document.createElement('div');
    digit.className = 'digit';
    const strip = document.createElement('div');
    strip.className = 'digit-strip';
    for (let n = 0; n <= 9; n++) {
      const span = document.createElement('span');
      span.textContent = n;
      strip.appendChild(span);
    }
    digit.appendChild(strip);
    odometer.appendChild(digit);
    wheels.push(strip);
  }

  function setCount(count) {
    const str = String(Math.max(0, count)).padStart(DIGITS, '0').slice(-DIGITS);
    for (let i = 0; i < DIGITS; i++) {
      wheels[i].style.setProperty('--n', str[i]);
    }
  }

  function setStatus(ok) {
    statusDot.className = 'status-dot ' + (ok ? 'ok' : 'err');
    statusText.textContent = ok ? 'connected' : 'offline';
  }

  function setError(msg) {
    errorMsg.textContent = msg || '';
  }

  async function loadCount() {
    try {
      const res = await fetch('/api/count');
      if (!res.ok) throw new Error();
      const data = await res.json();
      setCount(data.count);
      setStatus(true);
      setError('');
    } catch {
      setStatus(false);
      setError('Could not reach the counter service.');
    }
  }

  async function logVisit() {
    hitBtn.disabled = true;
    try {
      const res = await fetch('/api/hit', { method: 'POST' });
      if (!res.ok) throw new Error();
      const data = await res.json();
      setCount(data.count);
      setStatus(true);
      setError('');
    } catch {
      setStatus(false);
      setError('Visit was not recorded. Try again.');
    } finally {
      hitBtn.disabled = false;
    }
  }

  async function resetCount() {
    resetBtn.disabled = true;
    try {
      const res = await fetch('/api/reset', { method: 'POST' });
      if (!res.ok) throw new Error();
      const data = await res.json();
      setCount(data.count);
      setError('');
    } catch {
      setError('Reset failed. Try again.');
    } finally {
      resetBtn.disabled = false;
    }
  }

  hitBtn.addEventListener('click', logVisit);
  resetBtn.addEventListener('click', resetCount);

  loadCount();
</script>

</body>
</html>
